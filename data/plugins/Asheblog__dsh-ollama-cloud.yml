description:
  en: "Ollama Cloud provider for DeepSeek Harness that configures the route on install, publishes each model's own thinking levels for the composer effort control, and adds live model discovery plus Ollama web search and fetch."
  zh: "Ollama Cloud 供应商：安装即配好路由，按 Ollama 模型自身元数据公布每个模型的思维链档位（供 composer 的推理强度选择），并提供模型发现与 Web 搜索/抓取。"
